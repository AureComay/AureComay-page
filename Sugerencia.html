<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sugerencias</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Global.css">
<style>
.NavBox {
    width: 30%;
    height: 20%;
    margin-top: 16%;
    margin-bottom: 15%;
}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Enviar Sugerencia</h1>
<h2><a href="Utilidades.html">¿Volver a utilidades?</a></h2>

<div class="NavBox">
    <h2>Enviar Sugerencia</h2>

    <textarea id="sugBox" placeholder="Escribe tu sugerencia aquí..." 
        style="width: 80%; height: 120px; background:#000000b6; color:#00ff00;
               border: 2px solid #00ff00; margin-top:15px; font-family:'Pixelify Sans';backdrop-filter: blur(10px);resize: vertical;" rows="5" cols="33" placeholder="Sugerencia...;">
    </textarea>
    <br>

    <button id="sendBtn" 
        style="margin-top: 15px; padding: 10px 15px; background: #4b0082; 
               color:#00ff00; border: 2px solid #008f00; cursor:pointer;
               font-family:'Bytesized';">
        Enviar
    </button>

    <div id="msg" 
         style="margin-top:10px; font-family:'Tiny5'; color:#00ff00; text-shadow:0 0 6px #00ff00;">
    </div>
</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDyKCSJI1cx8THyVTPrNPscbVMgffEkknk",
        authDomain: "aurecomaypages.firebaseapp.com",
        databaseURL: "https://aurecomaypages-default-rtdb.firebaseio.com/",
        projectId: "aurecomaypages",
        storageBucket: "aurecomaypages.firebasestorage.app",
        messagingSenderId: "538178961737",
        appId: "1:538178961737:web:00528dddf5c4091c09da98"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const sugBox = document.getElementById("sugBox");
    const sendBtn = document.getElementById("sendBtn");
    const msg = document.getElementById("msg");

    sendBtn.onclick = async () => {
        let text = sugBox.value.trim();

        if (!text) {
            msg.textContent = "No puedes enviar un mensaje vacío.";
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = "Enviando...";

        try {
            await db.ref("sugerencias").push({
                mensaje: text,
                fecha: new Date().toISOString()
            });

            msg.textContent = "¡Sugerencia enviada!";
            sugBox.value = "";
        } catch (error) {
            console.error(error);
            msg.textContent = "Error al enviar.";
        }

        sendBtn.disabled = false;
        sendBtn.textContent = "Enviar";
    };
</script>

</body>
</html>
